<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IOTEL — Cart</title>
  <link rel="stylesheet" href="static/css/global.css">
  <link rel="stylesheet" href="static/css/cart.css">
</head>
<body>
  <!-- Header -->
  <header class="customer-header">
    <div class="header-inner">
      <div class="brand">
        <a href="catalog.html" class="brand-link">
          <span class="brand-name">IOTEL</span>
          <span class="brand-sub">by Goldcomm</span>
        </a>
      </div>
      <nav class="header-nav">
        <a href="catalog.html" class="nav-link">Catalog</a>
        <a href="services.html" class="nav-link">Services</a>
        <a href="orders.html" class="nav-link">Orders</a>
        <a href="messages.html" class="nav-link">Messages</a>
        <a href="about.html" class="nav-link">About</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="cart-btn"><span class="cart-icon-btn">🛒</span></a>
        <div class="profile-menu" id="profileMenuContainer">
          <button class="profile-btn" id="profileMenuBtn">👤 <span class="user-name">Guest</span> ▼</button>
          <div class="profile-dropdown" id="profileDropdown" style="display:none;">
            <a href="settings.html" class="dropdown-item">Profile</a>
            <a href="addresses.html" class="dropdown-item">My Addresses</a>
            <a href="settings.html" class="dropdown-item">Settings</a>
            <div class="dropdown-divider"></div>
            <button id="headerLogoutBtn2" class="dropdown-item logout-item">Log Out</button>
          </div>
        </div>
        <button class="hamburger-btn" id="hamburgerBtn">☰</button>
      </div>
    </div>
  </header>

  <main class="customer-content">
    <section class="cart-container">
      <h1 class="page-title">Shopping Cart</h1>

      <div id="emptyCart" class="empty-cart" style="display:none;">
        <p>Your cart is empty</p>
        <div class="mt-6 text-center">
          <a href="catalog.html" class="shop-btn">Continue Shopping</a>
        </div>
      </div>

      <div id="cartLayout" class="cart-layout" style="display:none;">
        <div class="cart-items">
          <div id="freeShippingNotice"></div>
          <div id="itemsList" class="items-list"></div>

          <div class="cart-actions">
            <button id="clearCartBtn" class="shop-btn" style="background:#fff;border:1px solid #f0f0f0;color:#CC2020">Clear Cart</button>
            <a href="catalog.html" class="shop-btn">Continue Shopping</a>
          </div>
        </div>

        <div class="order-summary">
          <h2 class="summary-title">Order Summary</h2>
          <div class="summary-row"><span>Subtotal</span><span id="subtotalText">₱0</span></div>
          <div class="summary-row"><span>Shipping</span><span id="shippingText">₱0</span></div>
          <div class="summary-row total-row"><span>Total</span><span id="totalText">₱0</span></div>
          <a id="proceedCheckout" href="checkout.html" class="checkout-btn">Proceed to Checkout</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="customer-footer">IOTEL &copy; 2026 Goldcomm Corporation. All rights reserved.</footer>

  <script src="static/js/mock-data.js"></script>
  <script src="static/js/site.js"></script>
  <script src="static/js/cart.js"></script>
</body>
</html>
