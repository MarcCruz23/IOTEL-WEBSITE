<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IOTEL — Messages</title>
  <link rel="stylesheet" href="static/css/global.css">
  <link rel="stylesheet" href="static/css/messages.css">
</head>
<body>
  <header class="customer-header">
    <div class="header-inner">
      <div class="brand">
        <a href="catalog.html" class="brand-link">
          <span class="brand-name">IOTEL</span>
          <span class="brand-sub">by Goldcomm</span>
        </a>
      </div>
      <nav class="header-nav">
        <a href="catalog.html" class="nav-link">Catalog</a>
        <a href="services.html" class="nav-link">Services</a>
        <a href="orders.html" class="nav-link">Orders</a>
        <a href="messages.html" class="nav-link active-link">Messages</a>
        <a href="about.html" class="nav-link">About</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="cart-btn"><span class="cart-icon-btn">🛒</span></a>
        <div class="profile-menu" id="profileMenuContainer">
          <button class="profile-btn" id="profileMenuBtn">👤 <span class="user-name">Guest</span> ▼</button>
          <div class="profile-dropdown" id="profileDropdown" style="display:none;">
            <a href="settings.html" class="dropdown-item">Profile</a>
            <a href="addresses.html" class="dropdown-item">My Addresses</a>
            <a href="settings.html" class="dropdown-item">Settings</a>
            <div class="dropdown-divider"></div>
            <button id="headerLogoutBtn2" class="dropdown-item logout-item">Log Out</button>
          </div>
        </div>
        <button class="hamburger-btn" id="hamburgerBtn">☰</button>
      </div>
    </div>
  </header>

  <main class="customer-content">
    <section class="messages-container">
      <div class="messages-layout">
        <div class="conv-list">
          <div class="conv-list-header">
            <h2 class="conv-title">Messages</h2>
            <button id="newConvBtn" class="book-btn">New</button>
          </div>
          <div id="convsEmpty" class="empty-convs" style="display:none;">No conversations</div>
          <div id="conversations" class="conversations"></div>
        </div>

        <div class="thread-area">
          <div id="threadPlaceholder" class="empty-thread">Select a conversation</div>
          <div id="threadView" class="thread-view" style="display:none;">
            <div class="thread-header">
              <button id="backToList" class="back-btn">← Back</button>
              <div>
                <h1 id="threadTitle">Conversation</h1>
                <p id="threadCustomer">Customer support</p>
              </div>
            </div>
            <div id="threadMessages" class="thread-messages"></div>
            <form id="msgForm" class="msg-form">
              <input id="msgInput" placeholder="Type a message..." autocomplete="off" />
              <button class="send-btn" type="submit" aria-label="Send message">➤ <span>Send</span></button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="customer-footer">IOTEL &copy; 2026 Goldcomm Corporation. All rights reserved.</footer>

  <!-- New Conversation Modal -->
  <div id="newConvModal" class="modal" style="display:none;">
    <div class="modal-box">
      <h3>New Conversation</h3>
      <form id="newConvForm">
        <label>Subject</label>
        <input id="convSubject" required />
        <label>Message</label>
        <textarea id="convMessage" rows="4" required></textarea>
        <div class="modal-footer">
          <button type="button" id="closeNewConv">Cancel</button>
          <button type="submit" class="book-btn">Send</button>
        </div>
      </form>
    </div>
  </div>

  <script src="static/js/mock-data.js"></script>
  <script src="static/js/site.js"></script>
  <script src="static/js/messages.js"></script>
</body>
</html>
