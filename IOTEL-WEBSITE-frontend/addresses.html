<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IOTEL — My Addresses</title>
  <link rel="stylesheet" href="static/css/global.css">
  <link rel="stylesheet" href="static/css/addresses.css">
</head>
<body>
  <header class="customer-header">
    <div class="header-inner">
      <div class="brand">
        <a href="catalog.html" class="brand-link">
          <span class="brand-name">IOTEL</span>
          <span class="brand-sub">by Goldcomm</span>
        </a>
      </div>
      <nav class="header-nav">
        <a href="catalog.html" class="nav-link">Catalog</a>
        <a href="services.html" class="nav-link">Services</a>
        <a href="orders.html" class="nav-link">Orders</a>
        <a href="messages.html" class="nav-link">Messages</a>
        <a href="about.html" class="nav-link">About</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="cart-btn"><span class="cart-icon-btn">🛒</span></a>
        <div class="profile-menu" id="profileMenuContainer">
          <button class="profile-btn" id="profileMenuBtn">👤 <span class="user-name">Guest</span> ▼</button>
          <div class="profile-dropdown" id="profileDropdown" style="display:none;">
            <a href="settings.html" class="dropdown-item">Profile</a>
            <a href="addresses.html" class="dropdown-item">My Addresses</a>
            <a href="settings.html" class="dropdown-item">Settings</a>
            <div class="dropdown-divider"></div>
            <button id="headerLogoutBtn2" class="dropdown-item logout-item">Log Out</button>
          </div>
        </div>
        <button class="hamburger-btn" id="hamburgerBtn">☰</button>
      </div>
    </div>
  </header>

  <main class="customer-content">
    <section class="addr-container">
      <div class="page-header">
        <h1 class="page-title">My Addresses</h1>
        <button id="addAddressBtn" class="book-btn">Add Address</button>
      </div>

      <div id="addressesGrid" class="addr-grid"></div>
    </section>
  </main>

  <footer class="customer-footer">IOTEL &copy; 2026 Goldcomm Corporation. All rights reserved.</footer>

  <!-- Address Modal -->
  <div id="addrModal" class="modal" style="display:none;">
    <div class="modal-box">
      <h3 id="addrModalTitle">Add Address</h3>
      <form id="addrForm">
        <div class="form-row">
          <div class="flex-1"><label>Full Name</label><input id="addrFullName" required /></div>
          <div class="flex-1"><label>Mobile</label><input id="addrMobile" required /></div>
        </div>
        <label>Address Line</label>
        <input id="addrLine" required />
        <div class="form-row">
          <div class="flex-1"><label>City</label><input id="addrCity" required /></div>
          <div class="flex-1"><label>Province</label><input id="addrProvince" required /></div>
          <div style="width:100px"><label>ZIP</label><input id="addrZip" required /></div>
        </div>
        <div class="modal-footer">
          <button type="button" id="cancelAddrBtn">Cancel</button>
          <button type="submit" class="book-btn">Save Address</button>
        </div>
      </form>
    </div>
  </div>

  <script src="static/js/site.js"></script>
  <script src="static/js/addresses.js"></script>
</body>
</html>
