<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IOTEL Admin — Messages</title><link rel="stylesheet" href="../static/css/global.css"><link rel="stylesheet" href="../static/css/messages.css"><link rel="stylesheet" href="../static/css/admin.css"></head><body class="admin-body"><div class="admin-shell"><aside class="admin-sidebar"><div class="admin-brand"><span class="admin-brand-name">IOTEL</span><span class="admin-brand-sub">Admin</span></div><nav class="admin-nav"><a href="dashboard.html"><span class="admin-nav-icon">▦</span>Dashboard</a><a href="orders.html"><span class="admin-nav-icon">▤</span>Orders</a><a href="products.html"><span class="admin-nav-icon">◫</span>Products</a><a href="inventory.html"><span class="admin-nav-icon">▥</span>Inventory</a><a class="active" href="messages.html"><span class="admin-nav-icon">✉</span>Messages</a></nav><div class="admin-sidebar-bottom"><span class="admin-user">Admin User</span><div class="admin-bottom-actions"><button class="admin-logout" type="button" onclick="logout()">⇥ Logout</button><button class="admin-collapse" type="button" aria-label="Collapse sidebar">‹</button></div></div></aside><main class="admin-main"><section class="admin-messages-page"><div class="messages-layout"><div class="conv-list admin-conversations"><div class="conv-list-header admin-conversations-header"><h2 class="conv-title">Messages</h2><button id="newConvBtn" class="admin-primary">+ New</button></div><div id="convsEmpty" class="empty-convs" style="display:none">No conversations</div><div id="conversations" class="conversations"></div></div><div class="thread-area admin-thread"><div id="threadPlaceholder" class="empty-thread admin-thread-placeholder">Select a conversation</div><div id="threadView" class="thread-view admin-thread-view" style="display:none"><div class="thread-header"><button id="backToList" class="back-btn">← Back</button><div><h1 id="threadTitle">Conversation</h1><p id="threadCustomer">Customer</p></div></div><div id="threadMessages" class="thread-messages admin-thread-messages"></div><form id="msgForm" class="msg-form admin-message-form"><input id="msgInput" placeholder="Type a message..." autocomplete="off"><button class="send-btn" type="submit" aria-label="Send message">➤ <span>Send</span></button></form></div></div></div></section></main></div><div id="newConvModal" class="modal" style="display:none"><div class="modal-box"><h3>New Conversation</h3><form id="newConvForm"><label>Subject</label><input id="convSubject" required><label>Message</label><textarea id="convMessage" rows="4" required></textarea><div class="modal-footer"><button type="button" id="closeNewConv">Cancel</button><button type="submit" class="admin-primary">Send</button></div></form></div></div><script src="../static/js/mock-data.js"></script><script src="../static/js/site.js"></script><script src="../static/js/admin-messages.js?v=2"></script><script src="../static/js/admin-shell.js"></script><style>.admin-messages-page{padding:28px 32px}.admin-messages-page .messages-layout{min-height:calc(100vh - 100px)}.admin-messages-page .conv-item{display:block;width:100%;border:0;border-bottom:1px solid #eef0f3;text-align:left;font-family:inherit}.admin-messages-page .conv-customer{display:block;margin-top:5px;color:#475569;font-size:11px}.admin-messages-page .thread-header{display:flex;align-items:center;gap:14px;padding:19px 24px;background:#fff;border-bottom:1px solid #e5e7eb}.admin-messages-page .thread-header h1{margin:0;font-size:17px;color:#172033}.admin-messages-page .thread-header p{margin:5px 0 0;color:#6b7280;font-size:12px}.admin-messages-page .thread-header .back-btn{display:none}.admin-messages-page .msg-sent{background:#2563eb;border-bottom-right-radius:4px}.admin-messages-page .msg-recv{border-bottom-left-radius:4px}@media(max-width:800px){.admin-messages-page{padding:20px 14px}.admin-messages-page .messages-layout{min-height:calc(100vh - 170px)}.admin-messages-page .thread-header .back-btn{display:block}.admin-messages-page .thread-area,.admin-messages-page .thread-view{min-height:540px}}</style></body></html>
