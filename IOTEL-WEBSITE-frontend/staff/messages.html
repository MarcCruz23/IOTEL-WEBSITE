<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IOTEL Staff — Messages</title><link rel="stylesheet" href="../static/css/global.css"><link rel="stylesheet" href="../static/css/messages.css"><link rel="stylesheet" href="../static/css/staff.css"><style>.staff-messages-page{padding:28px 32px}.staff-messages-page .messages-layout{min-height:calc(100vh - 100px)}.staff-messages-page .conv-list-header{padding:20px}.staff-messages-page .thread-header{display:flex;align-items:center;gap:14px;padding:19px 24px;background:#fff;border-bottom:1px solid #e5e7eb}.staff-messages-page .thread-header h1{margin:0;font-size:17px;color:#172033}.staff-messages-page .thread-header p{margin:5px 0 0;color:#6b7280;font-size:12px}.staff-messages-page .thread-header .back-btn{display:none}.staff-messages-page .conv-item{display:block;width:100%;border:0;border-bottom:1px solid #eef0f3;text-align:left;font-family:inherit}.staff-messages-page .conv-customer{display:block;margin-top:5px;color:#475569;font-size:11px}.staff-messages-page .message-row.staff{align-self:flex-end;align-items:flex-end}.staff-messages-page .message-row.customer{align-self:flex-start;align-items:flex-start}.staff-messages-page .msg-sent{background:#2563eb;border-bottom-right-radius:4px}.staff-messages-page .msg-recv{border-bottom-left-radius:4px}@media(max-width:800px){.staff-messages-page{padding:20px 14px}.staff-messages-page .messages-layout{min-height:calc(100vh - 170px)}.staff-messages-page .thread-header .back-btn{display:block}.staff-messages-page .thread-area,.staff-messages-page .thread-view{min-height:540px}}</style></head><body class="staff-body"><div class="staff-shell"><aside class="staff-sidebar"><div class="staff-brand"><span class="staff-brand-name">IOTEL</span><span class="staff-brand-sub">Staff Portal</span></div><nav class="staff-nav"><a href="dashboard.html"><span class="staff-nav-icon">▦</span>Dashboard</a><a href="orders.html"><span class="staff-nav-icon">▤</span>Orders</a><a href="inventory.html"><span class="staff-nav-icon">▥</span>Inventory</a><a class="active" href="messages.html"><span class="staff-nav-icon">✉</span>Messages</a></nav><div class="staff-sidebar-bottom"><span class="staff-user">Staff User</span><div class="staff-bottom-actions"><button class="staff-logout" type="button" onclick="logout()">⇥ Logout</button><button class="staff-collapse" type="button" aria-label="Collapse sidebar">‹</button></div></div></aside><main class="staff-main"><section class="staff-messages-page"><div class="messages-layout"><div class="conv-list staff-conversations"><div class="conv-list-header staff-conversations-header"><h2 class="conv-title">Messages</h2></div><div id="convsEmpty" class="empty-convs" style="display:none">No conversations</div><div id="conversations" class="conversations"></div></div><div class="thread-area staff-thread"><div id="threadPlaceholder" class="empty-thread staff-thread-placeholder">Select a conversation</div><div id="threadView" class="thread-view staff-thread-view" style="display:none"><div class="thread-header"><button id="backToList" class="back-btn">← Back</button><div><h1 id="threadTitle">Conversation</h1><p id="threadCustomer">Customer</p></div></div><div id="threadMessages" class="thread-messages staff-thread-messages"></div><form id="msgForm" class="msg-form staff-message-form"><input id="msgInput" placeholder="Type a message..." autocomplete="off"><button class="send-btn" type="submit" aria-label="Send message">➤ <span>Send</span></button></form></div></div></div></section></main></div><script src="../static/js/mock-data.js"></script><script src="../static/js/site.js"></script><script src="../static/js/staff-messages.js"></script><script src="../static/js/staff-shell.js"></script></body></html>
