<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IOTEL Staff — Dashboard</title>
  <link rel="stylesheet" href="../static/css/global.css">
  <link rel="stylesheet" href="../static/css/staff.css">
</head>
<body class="staff-body"><div class="staff-shell">
  <aside class="staff-sidebar"><div class="staff-brand"><span class="staff-brand-name">IOTEL</span><span class="staff-brand-sub">Staff Portal</span></div><nav class="staff-nav"><a class="active" href="dashboard.html"><span class="staff-nav-icon">▦</span>Dashboard</a><a href="orders.html"><span class="staff-nav-icon">▤</span>Orders</a><a href="inventory.html"><span class="staff-nav-icon">▥</span>Inventory</a><a href="messages.html"><span class="staff-nav-icon">✉</span>Messages</a></nav><div class="staff-sidebar-bottom"><span class="staff-user">Staff User</span><div class="staff-bottom-actions"><button class="staff-logout" type="button" onclick="logout()">⇥ Logout</button><button class="staff-collapse" type="button" aria-label="Collapse sidebar">‹</button></div></div></aside>
  <main class="staff-main"><div class="staff-content"><h1 class="staff-page-title">Staff Dashboard</h1><div class="staff-kpi-grid"><div class="staff-card staff-kpi"><span class="staff-kpi-icon">◷</span><span class="staff-kpi-label">Pending Orders</span><strong id="pendingOrdersStat" class="staff-kpi-value">0</strong></div><div class="staff-card staff-kpi"><span class="staff-kpi-icon">⚙</span><span class="staff-kpi-label">Processing</span><strong id="processingStat" class="staff-kpi-value">0</strong></div><div class="staff-card staff-kpi"><span class="staff-kpi-icon">✉</span><span class="staff-kpi-label">Unread Messages</span><strong id="unreadMessagesStat" class="staff-kpi-value">0</strong></div><div class="staff-card staff-kpi"><span class="staff-kpi-icon">⚠</span><span class="staff-kpi-label">Low / Out of Stock</span><strong id="lowStockStat" class="staff-kpi-value">0</strong></div></div><div class="staff-content-grid"><section class="staff-card staff-panel"><h2 class="staff-panel-title">Pending Order Queue</h2><div id="pendingQueue"></div></section><section class="staff-card staff-panel"><h2 class="staff-panel-title">Low Stock Alerts</h2><div id="lowStockAlerts"></div></section></div></div></main>
</div>
  <script src="../static/js/mock-data.js"></script>
  <script type="module" src="../static/js/staff-dashboard.js"></script>
  <script src="../static/js/site.js"></script>
  <script src="../static/js/staff-shell.js"></script>
  <script>document.querySelector('.staff-user').textContent=localStorage.getItem('IOTEL_USER_NAME')||'Staff User';</script>
</body>
</html>
